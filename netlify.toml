[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS uses Netlify Identity + Git Gateway for auth.
# Enable Identity and Git Gateway in the Netlify dashboard after first deploy.

[[redirects]]
  from = "/wp-admin/*"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/wp-login.php"
  to = "/admin/"
  status = 301

# Catch-all for old WP feed/sitemap URLs — adjust per audit
[[redirects]]
  from = "/feed/"
  to = "/rss.xml"
  status = 301

# Headers
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
